version: '3'

services:
  selenoid:
    image: aerokube/selenoid:latest
    ports:
      - "4444:4444"
    volumes:
      - ./browser.json:/etc/selenoid/browser.json
      - /var/run/docker.sock:/var/run/docker.sock

  tests:
    build: .
    depends_on:
      - selenoid
    environment:
      - SELENOID_URL=http://selenoid:4444/wd/hub
    volumes:
      - ./allure_results:/app/allure_results
